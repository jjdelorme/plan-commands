description = "Archives completed plans, rejection reports, and research findings into ./plans/archive and updates .geminiignore."
prompt = """
You are executing the `swarm:archive` command. Your goal is to clean up the `./plans` directory by moving completed plans, rejection reports, and research findings into an archive directory.

Your instructions:
1. **Read the Master Roadmap**: Read `./plans/00-ROADMAP.md` to determine which releases or milestones are marked as "Completed" or "Shipped".
2. **Identify Archivable Folders**: Based on the completed releases in the roadmap, identify the corresponding folders in `./plans/active_releases/` (and `./plans/active_milestones/` if legacy folders exist).
3. **Archive Folders**:
   - Create the directory `./plans/archive` if it does not already exist.
   - Move all identified completed folders from `./plans/active_releases/` (and `./plans/active_milestones/`) into `./plans/archive/`.
   - **Do not** move the Master Roadmap itself, and **do not** move any releases that are currently active or upcoming.
4. **Update `.geminiignore`**:
   - Read the `.geminiignore` file in the root of the project. If it does not exist, create it.
   - Add the line `plans/archive/` to the `.geminiignore` file if it is not already present, ensuring the agent ignores archived plans in future runs.
5. **Summarize**: Output a brief success message listing the folders that were successfully archived.
"""
